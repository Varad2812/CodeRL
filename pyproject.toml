[project]
name = "coderl"
version = "0.1.0"
description = "Self-improving coding agent via RL from execution feedback (GRPO + sandboxed unit tests)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "datasets>=2.19",
    "pydantic>=2",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6",
    "numpy>=1.26",
    "datasketch>=1.6",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
train = [
    "torch",
    "transformers",
    "trl",
    "peft",
    "wandb",
    "accelerate",
]
# Hugging Face generation backend: CPU, Apple MPS and CUDA (Mac smoke tests, vLLM fallback).
hf = [
    "torch>=2.4",
    "transformers>=4.56,<5",
    "accelerate>=1.0",
]
# vLLM generation (Linux x86_64 + CUDA only). 0.18.1: Python 3.10-3.13, torch 2.10 (CUDA 12.8),
# reported working on Kaggle 2x T4 (SM75: float16, Triton attention backend). See docs/KAGGLE.md.
gen = [
    "coderl[hf]",
    "vllm==0.18.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
app = [
    "fastapi",
    "uvicorn",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coderl"]

[tool.uv]
default-groups = []
# Only core + dev are synced by default in CI/Mac; extras are opt-in.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["coderl"]

[[tool.mypy.overrides]]
module = "coderl.*"
disallow_untyped_defs = true

# The in-sandbox harness narrows types via identity checks on snapshotted locals
# (`_type(x) is _str`), which mypy cannot follow. It is covered by the security test-suite.
[[tool.mypy.overrides]]
module = "coderl.sandbox.harness"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "docker: needs a running Docker daemon (sandbox Docker backend)",
]
