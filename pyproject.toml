[project]
name = "coderl"
version = "0.1.0"
description = "Self-improving coding agent via RL from execution feedback (GRPO + sandboxed unit tests)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "datasets>=2.19",
    "pydantic>=2",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6",
    "numpy>=1.26",
    "datasketch>=1.6",
]

[project.optional-dependencies]
train = [
    "torch",
    "transformers",
    "trl",
    "peft",
    "wandb",
    "accelerate",
]
gen = [
    "vllm; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
app = [
    "fastapi",
    "uvicorn",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coderl"]

[tool.uv]
default-groups = []
# Only core + dev are synced by default in CI/Mac; extras are opt-in.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["coderl"]

[[tool.mypy.overrides]]
module = "coderl.*"
disallow_untyped_defs = true

# The in-sandbox harness narrows types via identity checks on snapshotted locals
# (`_type(x) is _str`), which mypy cannot follow. It is covered by the security test-suite.
[[tool.mypy.overrides]]
module = "coderl.sandbox.harness"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
